services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: celeb
      POSTGRES_PASSWORD: celeb
      POSTGRES_DB: celeb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    # No healthcheck: the minio server image ships neither curl nor mc. `init`
    # depends on it as service_started and retries connections (see init_stack.py).

  init:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["init"]
    environment: &appenv
      KAFKA_BOOTSTRAP: redpanda:19092
      POSTGRES_DSN: postgresql://celeb:celeb@postgres:5432/celeb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      INFERENCE_BACKEND: stub
      LLM_BACKEND: stub
      WATCHLIST_BACKEND: pg
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_started}

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["api"]
    environment: *appenv
    ports: ["8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}

  coordinator:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["coordinator"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-ingest:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "ingest"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-scene:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "scenes"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-transcribe:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "transcribe"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-face:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "faces"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-mention:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "mentions"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  worker-aggregate:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "aggregate"]
    environment: *appenv
    depends_on:
      init: {condition: service_completed_successfully}

  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command: tritonserver --model-repository=/models
    volumes:
      - ./model_repository:/models
    ports: ["8000:8000", "8001:8001", "8002:8002"]
    profiles: ["triton", "gpu"]
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ':> /dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  triton-gpu:
    extends: {service: triton}
    profiles: ["gpu"]
    # Generate the GPU model config before `--profile gpu up`:
    #   .venv/bin/python scripts/prepare_triton_models.py --kind KIND_GPU
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: all, capabilities: [gpu]}

  worker-face-triton:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["worker", "faces"]
    profiles: ["triton", "gpu"]
    environment:
      <<: *appenv
      INFERENCE_BACKEND: triton
      TRITON_URL: triton:8000
    depends_on:
      init: {condition: service_completed_successfully}
      triton: {condition: service_started}
